<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>精算補助システム</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#222222">
<link rel="shortcut icon" href="https://www.kantetsu.co.jp/cms/wp-content/themes/kr/img/favicon/favicon.ico">
<style>
/* ===== 基本レイアウト ===== */
body {
  margin: 0;
  background: #fff;
  font-family: "JFドットjiskan24h", "MS ゴシック", sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* ===== 開始画面（ログイン画面）オーバーレイ ===== */
#login-screen {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: rgba(0, 0, 0, 0.85);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 9999;
  font-family: "MS ゴシック", monospace;
  transition: opacity 0.4s ease;
}

.login-container {
  background: #222;
  border: 6px solid #555;
  padding: 40px 60px;
  border-radius: 8px;
  text-align: center;
  box-shadow: 0 10px 30px rgba(0,0,0,0.8);
}

.login-title {
  color: #ffcc00;
  font-size: 42px;
  margin-bottom: 30px;
  letter-spacing: 2px;
  text-shadow: 2px 2px 0px #000;
}

.start-btn {
  background: #33cc33;
  color: #000;
  border: none;
  font-size: 32px;
  font-weight: bold;
  font-family: "MS ゴシック", monospace;
  padding: 16px 40px;
  cursor: pointer;
  border-radius: 4px;
  transition: background 0.2s, transform 0.1s;
  box-shadow: 0 4px 10px rgba(0,0,0,0.5);
}

.start-btn:hover {
  background: #3ee53e;
  transform: scale(1.03);
}

.start-btn:active {
  transform: scale(0.98);
}

/* ===== 現在時刻エリア ===== */
.top {
  width: 1200px;
  display: grid;
  grid-template-columns: 120px 580px 1fr 100px;
  align-items: start;
  padding: 18px 0 5px;
  font-family: "MS ゴシック";
  box-sizing: border-box;
  margin: 0 auto;
}
.top .label { font-size: 30px; font-weight: bold; }
.top .time  { font-size: 100px; font-weight: bold; text-align: left; }

/* ===== 駅名看板 ===== */
.station-sign {
  width: 500px;
  height: 120px;
  background: #fff;
  border: 4px solid #000;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  font-family: "国鉄っぽいフォント（正体）", "MS ゴシック", monospace;
}
.sign-main {
  font-size: 50px;
  letter-spacing: 2px;
  margin-bottom: 6px;
}
.sign-sub {
  font-size: 42px;
  padding: 2px 24px;
  border-top: 2px solid #000;
}

/* ===== 発車標ボード ===== */
.board {
  display: grid;
  grid-template-columns: 850px;
  justify-content: center;
  margin: 10px 0;
}
.board > div {
  width: 850px;
  background: #777;
  margin: 8px 0;
}

/* ===== ブロック ===== */
.block {
  background: #666;
  margin: 0;
  padding: 8px;
}

/* ===== タイトル ===== */
.block-title {
  display: grid;
  grid-template-columns: 80px 1fr 50px;
  align-items: center;
  color: #fff;
  font-size: 32px;
  font-family: "国鉄っぽいフォント（正体）";
  margin-bottom: 6px;
}
.block-title .no {
  border: 3px solid #fff;
  width: 45px;
  text-align: center;
}

/* ===== ヘッダー（見出し） ===== */
.header {
  display: grid;
  grid-template-columns: 160px 320px 170px 100px 80px;
  font-size: 22px;
  font-family: "MS ゴシック";
  color: #fff;
  text-align: center;
  margin-bottom: 4px;
}

/* ===== テーブル行 ===== */
.table {
  background: #3a3a3a;
  padding: 6px 0;
}
.row {
  display: grid;
  grid-template-columns: 160px 320px 166px 104px 80px;
  align-items: center;
  margin-bottom: 3px;
  height: 65px;
}

/* ===== 表示文字 ===== */
.type  { color: #33cc33; font-size: 56px; text-align: center; }
.dest  { color: #ffcc00; font-size: 56px; text-align: center; }
.time2 { color: #33cc33; font-size: 56px; text-align: right; position: relative; }
.cars  { color: #ffcc00; font-size: 56px; text-align: center; }
.track { color: #33cc33; font-size: 56px; text-align: center; }

.cars .suffix {
  font-size: 30px;
  position: relative;
  top: -2px;
  margin-left: 2px;
}

/* ===== 遅延・アニメーション表示 ===== */
.time2 .delay {
  position: absolute;
  bottom: -24px;
  left: 50%;
  transform: translateX(-50%);
  color: red;
  font-size: 26px;
  white-space: nowrap;
}

@keyframes blink {
  0% { opacity: 1; }
  50% { opacity: 0; }
  100% { opacity: 1; }
}
@keyframes scrollText {
  0%   { transform: translateX(0%); }
  100% { transform: translateX(-100%); }
}

.row.arrival {
  grid-template-columns: 1fr;
  height: 65px;
}
.row.arrival > div {
  grid-column: 1 / -1;
  width: 100%;
  font-size: 52px;
  text-align: center;
  color: #ff3333;
  overflow: hidden;
  white-space: nowrap;
}
.row.arrival.scroll span {
  display: inline-block;
  min-width: 100%;
  padding-left: 100%;
  animation: scrollText 12s linear;
}
.row.arrival.blink > div {
  animation: blink 1s steps(1) infinite;
}
.type.rapid {
  color: #ff3333;
}
</style>
</head>

<!-- 開始画面（ログイン画面）オーバーレイ -->
<div id="login-screen">
  <div class="login-container">
    <div class="login-title">精算補助システム</div>
    <button class="start-btn" id="startSystemBtn">開始する</button>
  </div>
</div>

<!-- 現在時刻・看板エリア -->

  <div class="time" id="now">00:00</div>
  <div class="service-info">

      <div class="sign-main" id="todayDate">0000年00月00日</div>
      <div class="sign-sub" id="dayType">---</div>
    </div>
  </div>
</div>

<!-- 遅延設定・操作ボタンエリア -->
<div class="top" style="margin-top:-20px; display:flex; gap:8px; align-items:center;">
  <label>列車番号: <input type="text" id="delayTrainNo" style="width:80px;"></label>
  <label>遅延時間(分): <input type="number" id="delayMinutes" style="width:60px;"></label>
  <button id="addDelay">追加</button>
</div>

<!-- ダイヤ切替エリア -->
<div class="top" style="margin-top:-10px; display:flex; gap:8px; align-items:center;">
  <span>ダイヤ切替：</span>
  <button id="btnAuto">自動</button>
  <button id="btnWeekday">平日</button>
  <button id="btnHoliday">休日</button>
  <span id="timetableStatus" style="margin-left:18px;"></span>
  <span>　　アラームを止めるにはスペースキーを押してください</span>
</div>

<!-- 発車標表示エリア -->
<div class="board" id="board"></div>

let showGuideSecondRow = false;
let currentGuideMessageUp = "";
let manualDayType = null;
let showDelayNormal = true;
let lang = 'ja';

// アラーム再生用のAudioオブジェクト
const alarmSound = new Audio('alarm.mp3');
alarmSound.loop = true; 
let lastAlarmPlayedTrainNo = null;

// ユーザー操作ハンドリング（開始ボタンクリック時にも有効化）
let userInteracted = false;

document.getElementById('startSystemBtn').addEventListener('click', () => {
  userInteracted = true;
  alarmSound.load();
  
  // ログイン画面をフェードアウトして非表示にする
  const loginScreen = document.getElementById('login-screen');
  loginScreen.style.opacity = '0';
  setTimeout(() => {
    loginScreen.style.display = 'none';
  }, 400);
});

// スペースキーが押されたらアラームを停止する
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.key === ' ') {
    e.preventDefault();
    if (!alarmSound.paused) {
      alarmSound.pause();
      alarmSound.currentTime = 0;
    }
  }
});

const holidays = {
  2026: [
    "2026-01-01", "2026-01-12", "2026-02-11", "2026-02-23",
    "2026-03-20", "2026-04-29", "2026-05-03", "2026-05-04",
    "2026-05-05", "2026-07-20", "2026-08-11", "2026-09-21",
    "2026-09-23", "2026-10-12", "2026-11-03", "2026-11-23"
  ]
};

const delays = {};

function parseCsv(csv){
  return csv.trim().split('\n').map(line=>{
    const c = line.split(',');
    return {
      no: c[0],
      dest: c[1],
      track: c[2],
      time: c[3],
      type: c[4],
      trackno: c[5],
      cars: c[6],
      arrivalMin: Number(c[7] || 1)
    };
  });
}

function normalizeDest(dest) {
  return dest.replace(/\s+/g, '');
}

function generateGuideMessageUp(train) {
  if (!train) return "";
  const dest = normalizeDest(train.dest);

  if (train.track === "乗") return `こんどの${dest}行きは水海道にて乗り換えとなります。`;
  if (train.track === "始") return `こんどの${dest}行きは当駅始発の列車です。`;
  if (train.track === "接") return `こんどの${dest}行きは水海道にて快速に接続いたします。`;
  if (train.cars === "1") return `こんどの${dest}行きは1両編成でまいります。`;
  if (train.type === "快速") return `終点取手まで各駅に停車いたします。`;
  if (train.no === "") return `本日の上り列車はすべて終了いたしました。`;

  return `こんどの${dest}行のご案内です`;
}

function getRemainingTime(train){
  if(!train) return Infinity;
  const now = new Date();
  const [h,m] = train.time.split(':').map(Number);
  let dep = new Date(now);
  dep.setHours(h, m, 0, 0);

  const delay = delays[train.no] || 0;
  dep.setMinutes(dep.getMinutes() + delay);

  const nowH = now.getHours();
  if (h < 4 && nowH >= 4) {
    dep.setDate(dep.getDate() + 1);
  } else if (h >= 4 && nowH < 4) {
    dep.setDate(dep.getDate() - 1);
  }
  return (dep - now)/1000;
}

function isArrivingSoon(train){
  if(!train) return false;
  const diffSec = getRemainingTime(train);
  const beforeSec = (train.arrivalMin || 1) * 60;
  return diffSec <= beforeSec && diffSec > beforeSec - 60;
}

function getNextTrains(trains){
  const now = new Date();
  const nowMinutes = now.getHours() * 60 + now.getMinutes();

  return trains.filter(t=>{
    const [h,m] = t.time.split(':').map(Number);
    const delay = delays[t.no] || 0;
    let trainMinutes = h*60 + m + delay;

    if(h < 4 && now.getHours() >= 4){
      trainMinutes += 24*60;
    }
    return trainMinutes > nowMinutes;
  }).slice(0,2);
}

function renderRow(train){
  if(!train) return `<div class="row" style="height:65px;"></div>`;

  const delay = delays[train.no] || 0;
  const depTimeStr = train.time;

  let displayTimeHtml;
  if(delay > 0){
    displayTimeHtml = showDelayNormal
      ? `<span>${depTimeStr}</span>`
      : `<span class="delay">遅れ${delay}分</span>`;
  } else {
    displayTimeHtml = `<span>${depTimeStr}</span>`;
  }

  return `
    <div class="row">
      <div class="type ${train.type==='快速'?'rapid':''}">
        ${lang==='ja'?train.type:typeMap[train.type]}
      </div>
      <div class="dest">${lang==='ja'?train.dest:destMap[train.dest]}</div>
      <div class="time2">${displayTimeHtml}</div>
      <div class="cars">
        ${train.cars}<span class="suffix">${lang==='ja'?'両':(train.cars==='1'?'Car':'Cars')}</span>
      </div>
      <div class="track">${train.trackno}</div>
    </div>
  `;
}

function renderBlock(b){
  const firstTrain = b.trains[0];
  const secondTrain = b.trains[1];
  const arriving = firstTrain ? isArrivingSoon(firstTrain) : false;

  if (arriving && firstTrain) {
    if (firstTrain.track && firstTrain.track.includes("北")) {
      if (lastAlarmPlayedTrainNo !== firstTrain.no) {
        if (userInteracted) {
          alarmSound.currentTime = 0;
          alarmSound.play().catch(e => console.log("音声再生エラー:", e));
        }
        lastAlarmPlayedTrainNo = firstTrain.no;
      }
    }
  } else {
    if (!alarmSound.paused) {
      alarmSound.pause();
      alarmSound.currentTime = 0;
    }
    lastAlarmPlayedTrainNo = null;
  }

  let html = `
    <div class="block">
    <div class="block-title">
      <div class="no">${b.noLeft}</div>
      <div style="text-align:center">${b.title}</div>
      <div class="no">${b.noRight}</div>
    </div>
    <div class="header">
      <div>種別</div><div>行先</div><div>発車時刻</div><div>両</div><div>番線</div>
    </div>
    <div class="table">`;

  html += renderRow(firstTrain);

  if(arriving){
    html += `<div class="row arrival blink"><div>列車がまいります</div></div>`;
  } else if(showGuideSecondRow){
    const msg = currentGuideMessageUp;
    if(msg && !msg.includes("ご案内です")){
      html += `<div class="row arrival scroll"><div><span>${msg}</span></div></div>`;
    } else {
      html += renderRow(secondTrain);
    }
  } else {
    html += renderRow(secondTrain);
  }

  html += `</div></div>`;
  return html;
}

function updateBoard(){
  const board = document.getElementById("board");
  const up = { noLeft:"2", noRight:"1", title:"上り 戸頭・取手方面", trains:getNextTrains(trainsUp) };
  board.innerHTML = `<div>${renderBlock(up)}</div>`;
}

function updateTime(){
  const d = new Date();
  document.getElementById("now").textContent =
    d.getHours().toString().padStart(2,'0') + ":" + d.getMinutes().toString().padStart(2,'0');
}

function isJapaneseHoliday(date){
  const y = date.getFullYear();
  const m = (date.getMonth() + 1).toString().padStart(2, "0");
  const d = date.getDate().toString().padStart(2, "0");
  const key = `${y}-${m}-${d}`;
  return holidays[y]?.includes(key) ?? false;
}

function updateDateInfo(){
  const d = new Date();
  const y = d.getFullYear();
  const m = d.getMonth() + 1;
  const day = d.getDate();

  const week = d.getDay();
  const isWeekend = (week === 0 || week === 6);
  const isHoliday = isJapaneseHoliday(d);

  document.getElementById("todayDate").textContent =
    `${y}年${m.toString().padStart(2,'0')}月${day.toString().padStart(2,'0')}日`;

  document.getElementById("dayType").textContent =
    (isWeekend || isHoliday) ? "休日ダイヤ" : "平日ダイヤ";
}

function loadTimetableByDayType(){
  let dayType;
  if(manualDayType){
    dayType = manualDayType;
  } else {
    const now = new Date();
    const week = now.getDay();
    const isWeekend = (week === 0 || week === 6);
    const isHoliday = isJapaneseHoliday(now);
    dayType = (isWeekend || isHoliday) ? "holiday" : "weekday";
  }

  if(currentDayType === dayType) return;
  currentDayType = dayType;

  if(dayType === "holiday"){
    trainsUp = parseCsv(csvUpHoliday);
  } else {
    trainsUp = parseCsv(csvUpWeekday);
  }

  updateBoard();
  updateTimetableStatus();
}

function updateTimetableStatus(){
  const el = document.getElementById("timetableStatus");
  if(manualDayType === "weekday"){
    el.textContent = "【平日ダイヤ 手動指定】";
  } else if(manualDayType === "holiday"){
    el.textContent = "【休日ダイヤ 手動指定】";
  } else {
    el.textContent = "【自動切替中】";
  }
}

function showGuideOnce(){
  const upTrains = getNextTrains(trainsUp);
  currentGuideMessageUp = generateGuideMessageUp(upTrains[0]);
  showGuideSecondRow = true;
  updateBoard();

  setTimeout(()=>{
    showGuideSecondRow = false;
    updateBoard();
  }, 15000);
}

/* イベントリスナー */
document.getElementById("addDelay").addEventListener("click", ()=>{
  const trainNo = document.getElementById("delayTrainNo").value.trim();
  const minutes = parseInt(document.getElementById("delayMinutes").value, 10);
  if(!trainNo || isNaN(minutes)) return alert("列車番号と遅延時間を正しく入力してください");
  
  delays[trainNo] = minutes;
  alert(`${trainNo}号列車に${minutes}分の遅延を設定しました`);
  updateBoard();
});

document.getElementById("btnAuto").addEventListener("click", ()=>{
  manualDayType = null;
  loadTimetableByDayType();
});
document.getElementById("btnWeekday").addEventListener("click", ()=>{
  manualDayType = "weekday";
  loadTimetableByDayType();
});
document.getElementById("btnHoliday").addEventListener("click", ()=>{
  manualDayType = "holiday";
  loadTimetableByDayType();
});

/* タイマー設定 */
setInterval(loadTimetableByDayType, 60 * 1000);
setInterval(showGuideOnce, 30000);
setInterval(()=>{
  showDelayNormal = !showDelayNormal;
  updateBoard();
}, 30000);
setInterval(()=>{
  lang = (lang==='ja') ? 'en' : 'ja';
  updateBoard();
}, 15000);

updateDateInfo();
setInterval(updateDateInfo, 60 * 1000);

updateTime();
loadTimetableByDayType();
updateBoard();
setInterval(updateTime, 1000);
